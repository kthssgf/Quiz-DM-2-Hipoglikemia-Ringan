<script>
const Q=(t,q,o,a,e)=>({t,q,o,a,e});
const D=[
Q("C1","Komponen Whipple’s triad pada hipoglikemia adalah…",["Gejala hipoglikemia, glukosa darah rendah, gejala membaik setelah glukosa naik","Poliuria, polidipsia, polifagia","Glukosa rendah, asidosis, ketonuria","Tremor, takikardia, berkeringat","Penurunan kesadaran, kejang, koma"],0,"Whipple’s triad: (1) gejala yang sesuai hipoglikemia, (2) kadar glukosa plasma rendah (slide: &lt;60 mg/dL), (3) gejala hilang setelah glukosa darah membaik. Poliuria-polidipsia-polifagia adalah gejala klasik hiperglikemia; tremor/takikardia hanyalah sebagian gejala hiperadrenergik."),
Q("C1","Manakah yang termasuk gejala hiperadrenergik hipoglikemia?",["Gangguan kognitif","Kejang","Keringat dingin, tremor, palpitasi","Penglihatan kabur dan letargi","Perilaku psikotik"],2,"Gejala hiperadrenergik (aktivasi simpatis dan kolinergik saat glukosa turun cepat): cemas, tremor, mual-muntah, palpitasi/takikardia, berkeringat, pucat, hipersalivasi, rasa lapar. Gangguan kognitif, kejang, letargi, penglihatan kabur, dan psikotik adalah gejala neuroglikopenik."),
Q("C1","Gejala neuroglikopenik hipoglikemia berikut ini, KECUALI…",["Konfusi","Kejang","Koma","Gangguan kognitif","Palpitasi dan berkeringat"],4,"Palpitasi dan berkeringat adalah gejala hiperadrenergik (autonom). Neuroglikopenik: gangguan kognitif, agitasi/labilitas emosi, perilaku psikotik, penglihatan kabur, letargi, konfusi, kejang, koma, akibat kurangnya glukosa di otak."),
Q("C1","Golongan obat antidiabetik oral dengan potensi hipoglikemia TERTINGGI adalah…",["Metformin","Sulfonilurea","Penghambat DPP-4","Penghambat alfa-glukosidase","Tiazolidindion"],1,"Obat yang meningkatkan sekresi insulin (sulfonilurea dan sekretagog kerja pendek/glinid) memiliki potensi hipoglikemia tinggi. Metformin, tiazolidindion, DPP-4 inhibitor, dan penghambat alfa-glukosidase berisiko minimal. Studi ADOPT: hipoglikemia pada 38,7% pengguna glyburide vs 11,6% metformin vs 9,8% rosiglitazon."),
Q("C1","Obat yang dapat menutupi respons hiperadrenergik sehingga hipoglikemia tidak disadari adalah…",["Beta-blocker","Metformin","ACE inhibitor","Statin","Aspirin"],0,"Beta-blocker (misal bisoprolol) menumpulkan respons hiperadrenergik (takikardia, tremor), sehingga pasien lebih sulit mengenali hipoglikemia (hypoglycemia unawareness). Obat lain tidak memiliki efek ini."),
Q("C1","Tatalaksana awal hipoglikemia pada pasien DM yang MASIH SADAR adalah…",["Dekstrosa 40% 50 mL IV bolus","Glukagon 1 mg IM","Hidrokortison 100 mg IV","Gula murni 20–30 g (bukan pemanis/gula diet) per oral dan hentikan sementara obat hipoglikemik","Infus NaCl 0,9% 1 L"],3,"Menurut SPM/PAPDI, stadium permulaan (sadar): beri gula murni 20–30 g atau larutan gula murni (bukan pemanis pengganti/gula diet), hentikan obat hipoglikemik sementara, pantau glukosa tiap 1–2 jam, pertahankan GD sekitar 200 mg/dL (bila sebelumnya tidak sadar), dan cari penyebab. Dekstrosa IV untuk pasien tidak sadar."),
Q("C1","Pada pasien hipoglikemia dengan penurunan kesadaran, terapi inisial yang tepat adalah…",["Gula pasir per oral","Dekstrosa 40% 50 mL (2 flakon) bolus intravena","Insulin regular IV","NaCl 0,45% 1 L","Natrium bikarbonat 100 mmol"],1,"Stadium lanjut (koma hipoglikemia/curiga hipoglikemia): dekstrosa 40% 2 flakon (50 mL) bolus IV, lalu infus dekstrosa 10% dan pantau GDS. Pemberian per oral berisiko aspirasi pada pasien tidak sadar."),
Q("C1","Dosis glukagon pada hipoglikemia (penyebab insulin) yang belum teratasi menurut PAPDI adalah…",["0,05–0,1 mg SC","0,5–1 mg IV/IM","5–10 mg IV","10 mg IV bolus","100 mg IV tiap 4 jam"],1,"Bila hipoglikemia belum teratasi dipertimbangkan antagonis insulin: glukagon 0,5–1 mg IV/IM atau kortison/adrenal. Hidrokortison 100 mg per 4 jam atau deksametason 10 mg IV adalah pilihan bila pasien belum sadar dengan glukosa sekitar 200 mg/dL."),
Q("C1","Kriteria diagnosis HHS (hyperglycemic hyperosmolar state) adalah…",["Glukosa &gt;250, pH &lt;7,00","Glukosa &gt;600 mg/dL, pH &gt;7,30, bikarbonat &gt;15, osmolalitas efektif &gt;320 mOsm/kg","Glukosa &gt;250, keton positif kuat","Glukosa &lt;60, osmolalitas normal","Glukosa &gt;200 dengan HbA1c ≥6,5%"],1,"HHS: glukosa plasma &gt;600 mg/dL, pH arteri &gt;7,30, bikarbonat &gt;15 mEq/L, keton urin/serum minimal, osmolalitas efektif &gt;320 mOsm/kg, anion gap &lt;12, sensorium stupor/koma. KAD: glukosa &gt;250, ada asidosis (pH &lt;7,30) dan ketonemia."),
Q("C1","Rumus osmolalitas serum efektif adalah…",["Na + glukosa/18","2 × Na (mEq/L) + glukosa (mg/dL)/18","Na − (Cl + HCO3)","2 × K + glukosa/18","BUN/2,8 + glukosa/18"],1,"Osmolalitas efektif = 2[Na terukur] + glukosa (mg/dL)/18. Na − (Cl + HCO3) adalah rumus anion gap."),
Q("C1","Klasifikasi KAD sedang menurut tabel kriteria diagnostik adalah…",["pH 7,25–7,30; bikarbonat 15–18","pH 7,00 sampai &lt;7,24; bikarbonat 10 sampai &lt;15","pH &lt;7,00; bikarbonat &lt;10","pH &gt;7,30; bikarbonat &gt;15","pH 7,35–7,45; bikarbonat 22–26"],1,"KAD ringan: pH 7,25–7,30, HCO3 15–18; sedang: pH 7,00–&lt;7,24, HCO3 10–&lt;15; berat: pH &lt;7,00, HCO3 &lt;10. Sensorium: ringan alert, sedang alert/drowsy, berat stupor/koma."),
Q("C1","Cairan yang dipilih untuk resusitasi awal KAD/HHS adalah…",["Dekstrosa 5%","NaCl 0,9% sekitar 1 L/jam (15–20 mL/kgBB/jam) pada jam pertama","Ringer asetat 100 mL/jam","Dekstrosa 40% bolus","Albumin 20%"],1,"Terapi cairan adalah pilar awal: NaCl 0,9% 15–20 mL/kgBB/jam (±1 L/jam) untuk memperluas volume intravaskular dan memperbaiki aliran darah ginjal tanpa menurunkan osmolaritas plasma mendadak. Selanjutnya NaCl 0,45% bila Na normal/tinggi."),
Q("C1","Sebelum insulin diberikan pada KAD, yang HARUS diperiksa terlebih dahulu adalah…",["Kadar kalium","Kadar kalsium","HbA1c","Kolesterol LDL","Asam urat"],0,"Insulin memasukkan K+ ke dalam sel sehingga dapat memicu hipokalemia berat yang mengancam jiwa. Bila K+ &lt;3,3 mEq/L, tunda insulin dan koreksi kalium dahulu."),
Q("C1","Kriteria diagnosis DM menurut PERKENI yang dipakai pada slide adalah…",["GDP ≥100 mg/dL","GDP ≥126 mg/dL, atau GD 2 jam TTGO ≥200, atau GDS ≥200 dengan keluhan klasik, atau HbA1c ≥6,5%","HbA1c ≥5,7%","GD 2 jam TTGO 140–199","GDS ≥140 mg/dL"],1,"Diagnosis DM: GDP ≥126 (puasa minimal 8 jam), atau GD 2 jam setelah TTGO 75 g ≥200, atau GDS ≥200 dengan keluhan klasik, atau HbA1c ≥6,5% (metode terstandarisasi NGSP). GD 140–199 pada TTGO adalah TGT (prediabetes)."),
Q("C2","Mengapa risiko hipoglikemia meningkat pada pasien DM dengan gangguan fungsi ginjal?",["Insulin endogen meningkat produksinya","Waktu ekskresi obat/insulin memanjang sehingga efek hipoglikemik berlangsung lebih lama","Glukoneogenesis meningkat","Absorpsi glukosa usus meningkat","Resistensi insulin meningkat"],1,"Pada penyakit ginjal, ekskresi obat (misal sulfonilurea, dan metabolit aktifnya) dan degradasi insulin terhambat sehingga kerja obat memanjang dan hipoglikemia lebih mudah terjadi dan lebih lama. Ini termasuk faktor risiko pada slide."),
Q("C2","Hasil penelitian ACCORD yang dibahas pada slide menunjukkan…",["Kontrol glikemik intensif menurunkan mortalitas 22%","Kontrol intensif pada pasien risiko KV tinggi meningkatkan mortalitas relatif 22% dan hipoglikemia berat lebih sering","Tidak ada perbedaan hipoglikemia antara kontrol intensif dan standar","Kontrol standar meningkatkan risiko demensia","ACCORD dihentikan karena kontrol standar gagal"],1,"ACCORD: terapi intensif menaikkan mortalitas relatif 22% dibanding standar pada pasien dengan risiko KV tinggi. Hipoglikemia berat lebih sering pada terapi intensif (ACCORD, ADVANCE, VADT). Mekanisme: aritmia (pemanjangan QT) dan neuroglikopenia progresif."),
Q("C3","Seorang laki-laki 89 tahun dibawa ke IGD dalam keadaan tidak sadar, GCS 8 (E2V2M4), TD 123/54, nadi 74x/menit, suhu 36,7 °C. Keluarga: makan siang sedikit namun tetap minum obat rutin: metformin 500 mg, glimepirid 4 mg, dan bisoprolol 5 mg. HbA1c terakhir 6,9%. Faktor yang PALING berkontribusi pada kondisi ini adalah…",["Sulfonilurea (glimepirid) + asupan kalori kurang + gangguan fungsi ginjal + beta-blocker yang menutupi gejala adrenergik","Metformin dosis berlebihan semata","Ketoasidosis diabetik","Sepsis","Stroke hemoragik"],0,"Kombinasi faktor risiko pada slide: sulfonilurea kerja panjang, kurangnya asupan kalori, penurunan ekskresi akibat penyakit ginjal, beta-blocker, usia lanjut, serta kontrol yang terlalu ketat (HbA1c 6,9% pada lansia). Metformin berisiko hipoglikemia minimal; tidak ada tanda infeksi (suhu normal)."),
Q("C3","Pada pasien di atas, hasil laboratorium menunjukkan glukosa darah sangat rendah. Tindakan pertama yang paling tepat adalah…",["Beri minum teh manis","Suntik dekstrosa 40% bolus IV (50 mL), kemudian infus dekstrosa 10% dan pantau GDS","Berikan insulin regular IV","Lakukan CT scan kepala terlebih dahulu","Beri NaCl 0,9% 1 L/jam"],1,"Pasien tidak sadar dengan hipoglikemia: dekstrosa 40% bolus IV 50 mL (pada kasus 40 mL), disusul dekstrosa 10% per infus dan pemantauan GDS. Pada kasus, glukosa naik menjadi 140 dan pasien mulai membuka mata dan berbicara (Whipple’s triad terpenuhi). Pencitraan tidak boleh menunda koreksi glukosa."),
Q("C3","Pasien lansia tersebut kemudian diobservasi 72 jam dan obat dihentikan. Alasan observasi lama ini adalah…",["Efek glimepirid (sulfonilurea) dan gangguan fungsi ginjal dapat membuat hipoglikemia berulang hingga 36–72 jam","Menunggu hasil kultur darah","Mencegah KAD","Karena dekstrosa 40% memiliki efek rebound hiperglikemia","Untuk titrasi bisoprolol"],0,"Slide: hipoglikemia pada pasien DM dapat berlangsung lama (36–72 jam), perlu rawat inap, cairan glukosa, dan pemantauan glukosa berkelanjutan, terutama dengan sulfonilurea kerja panjang dan fungsi ginjal memburuk. Obat harus dievaluasi ulang (glimepirid, metformin, bisoprolol dihentikan pada kasus)."),
Q("C3","Pasien DM tidak sadar mendapat bolus dekstrosa 40% 50 mL. GDS 1 jam kemudian 85 mg/dL. Langkah selanjutnya sesuai SPM PAPDI adalah…",["Hentikan semua terapi dan pantau tiap 6 jam","Tambah bolus dekstrosa 40% 25 mL IV dan lanjutkan pemantauan GDS","Tambah bolus dekstrosa 40% 50 mL IV","Turunkan kecepatan drip dekstrosa 10%","Berikan insulin SC"],1,"Algoritma PAPDI: GDS &lt;50 → tambah bolus D40% 50 mL; GDS &lt;100 → tambah bolus D40% 25 mL; GDS 100–200 → tanpa bolus; GDS &gt;200 → pertimbangkan menurunkan kecepatan drip D10%. Nilai 85 mg/dL tergolong &lt;100, jadi tambah 25 mL."),
Q("C3","Pasien hipoglikemia dengan GDS 150 mg/dL setelah koreksi, masih mendapat infus dekstrosa 10%. Tindakan yang tepat adalah…",["Bolus dekstrosa 40% 50 mL","Tanpa bolus dekstrosa 40%, lanjutkan pemantauan GDS berkala","Hentikan pemantauan","Berikan glukagon 1 mg","Beri insulin untuk menurunkan GDS"],1,"GDS 100–200 mg/dL: tidak perlu bolus D40%. Bila GDS &gt;100 tiga kali berturut-turut, pemantauan diperlebar tiap 2 jam, kemudian 4 jam; bila &gt;200, pertimbangkan ganti infus ke dekstrosa 5%/NaCl 0,9%."),
Q("C3","Pasien DM dengan hipoglikemia sudah mendapat D40% berulang tetapi tetap tidak sadar, glukosa sekitar 200 mg/dL. Langkah berikutnya sesuai algoritma EIMED PAPDI adalah…",["Ulangi D40% 100 mL","Hidrokortison 100 mg IV per 4 jam selama 12 jam atau deksametason 10 mg IV bolus, serta cari penyebab lain penurunan kesadaran","Hentikan infus dan observasi saja","Beri insulin kerja cepat","Beri bikarbonat"],1,"Bila belum sadar padahal glukosa ±200 mg/dL, berikan hidrokortison 100 mg per 4 jam (12 jam) atau deksametason 10 mg IV bolus (dilanjutkan 2 mg tiap 6 jam), dan manitol bila edema otak, serta cari penyebab lain (stroke, sepsis, ensefalopati, brain damage akibat hipoglikemia berkepanjangan)."),
Q("C3","Pasien DM tipe 2 usia 70 tahun dengan riwayat hipoglikemia berulang pada terapi metformin + sulfonilurea. Modifikasi terapi yang paling tepat adalah…",["Naikkan dosis sulfonilurea","Ganti sulfonilurea dengan DPP-4 inhibitor atau glitazon, dikombinasikan dengan metformin","Tambahkan glinid","Tambahkan insulin basal dosis tinggi","Hentikan semua obat tanpa alternatif"],1,"Rekomendasi NICE pada slide: bila risiko hipoglikemia dan dampaknya signifikan, tambahkan DPP-4 inhibitor atau glitazon ke metformin sebagai pengganti sulfonilurea. Glinid juga meningkatkan sekresi insulin sehingga tetap berisiko hipoglikemia."),
Q("C3","Perempuan 25 tahun DM tipe 1, lupa insulin 2 hari, demam, nyeri perut, mual-muntah, napas cepat dalam (30x/menit), napas berbau buah. GDS 480 mg/dL, pH 7,10, HCO3 12, keton serum positif, sensorium drowsy. Diagnosis dan tatalaksana awal yang tepat adalah…",["HHS; mulai insulin bolus segera","KAD derajat sedang; resusitasi NaCl 0,9% 15–20 mL/kgBB pada jam pertama, cek kalium, lalu insulin drip 0,1 U/kgBB/jam","KAD berat; bikarbonat 100 mmol segera","Hipoglikemia; dekstrosa 40%","Asidosis laktat; metformin dosis tinggi"],1,"pH 7,10 dan HCO3 12 = KAD sedang (pH 7,00–&lt;7,24; HCO3 10–&lt;15). Pencetus: lupa insulin dan infeksi. Urutan: cairan isotonik, cek K+ (insulin hanya bila K ≥3,3), insulin regular IV 0,15 U/kg bolus lalu 0,1 U/kg/jam. Bikarbonat hanya bila pH &lt;6,9 (pH 6,9–7,0 bila 50 mmol)."),
Q("C3","Pasien KAD, BB 60 kg, K+ 2,9 mEq/L. Tindakan yang tepat adalah…",["Mulai insulin drip segera","Tunda insulin, berikan KCl 40 mEq/jam (2/3 KCl, 1/3 KPO4) hingga K+ ≥3,3 mEq/L, sambil lanjut cairan","Berikan bikarbonat 100 mmol","Berikan dekstrosa 40%","Hentikan cairan"],1,"K+ &lt;3,3: tahan insulin dan beri kalium 40 mEq per jam sampai K+ ≥3,3. K+ ≥5,0: tidak perlu kalium, periksa tiap 2 jam. K+ 3,3–&lt;5,0: 20–30 mEq/L cairan IV untuk menjaga 4–5 mEq/L. Insulin tanpa koreksi K+ dapat memicu aritmia fatal."),
Q("C3","Pasien KAD mendapat insulin drip 0,1 U/kg/jam. Setelah 1 jam glukosa hanya turun 30 mg/dL. Tindakan yang tepat adalah…",["Hentikan insulin","Gandakan dosis insulin infus tiap jam hingga glukosa turun 50–70 mg/dL/jam","Beri bikarbonat","Turunkan dosis insulin","Ganti ke dekstrosa 5%"],1,"Target penurunan glukosa 50–70 mg/dL per jam. Bila tidak tercapai pada jam pertama (dan hidrasi memadai), gandakan insulin drip hingga target tercapai. Bila glukosa sudah mencapai 250 mg/dL, ganti ke D5% + NaCl 0,45% dengan insulin 0,05–0,1 U/kg/jam."),
Q("C3","Pada KAD, glukosa darah sudah turun menjadi 240 mg/dL tetapi ketoasidosis belum teratasi (pH 7,15). Langkah yang tepat adalah…",["Hentikan insulin","Tambahkan dekstrosa (D5% ½ NS) ke cairan dan lanjutkan insulin drip hingga ketoasidosis teratasi","Beri bikarbonat 100 mmol","Berikan glukagon","Hentikan semua cairan"],1,"Ketika glukosa mencapai 250 mg/dL pada KAD (300 pada HHS), tambahkan dekstrosa untuk mencegah hipoglikemia, namun insulin tetap diteruskan sampai ketoasidosis resolusi (anion gap normal). Setelah itu pasien makan, diberi insulin SC, dan infus insulin dihentikan 1–2 jam sesudah dosis SC."),
Q("C4","Perempuan 42 tahun, BMI 35, gangguan kesadaran setelah 1 minggu flu, mual-muntah; tidak memakai insulin &gt;1 tahun. Glukosa 723 mg/dL, Na 160 mEq/L, K 3,9, BUN 60, kreatinin 1,4, pH 7,30, HCO3 17, osmolaritas &gt;320, TD 91/54, RR 32. Diagnosis yang paling tepat dan pilihan cairan lanjutan setelah stabilisasi hemodinamik adalah…",["KAD murni; NaCl 0,9% terus-menerus","HHS (dengan komponen asidosis ringan); setelah NaCl 0,9% awal, ganti NaCl 0,45% 4–14 mL/kgBB/jam karena Na tinggi","Hipoglikemia; D40%","Asidosis laktat; bikarbonat","Sindrom nefrotik; furosemid"],1,"Glukosa tinggi, osmolalitas &gt;320, pH 7,30 dan HCO3 &gt;15 sesuai HHS; syok hipovolemik diatasi dahulu dengan NaCl 0,9%. Na terkoreksi tinggi → NaCl 0,45% sesuai status hidrasi. Pada kasus, pasien dirawat di ICU dengan dukungan napas, NaCl 0,45%, insulin IV, dan antibiotik karena pencetus infeksi."),
Q("C4","Pasien DM tipe 2 lansia: Na 150 mEq/L, glukosa 900 mg/dL, pH 7,35, HCO3 22, keton urin trace, stupor. Osmolalitas efektif dan interpretasinya adalah…",["300 mOsm/kg, normal","350 mOsm/kg, memenuhi kriteria HHS (&gt;320)","250 mOsm/kg, hipoosmolar","320 mOsm/kg, KAD ringan","450 mOsm/kg, KAD berat"],1,"Osm efektif = 2(150) + 900/18 = 300 + 50 = 350 mOsm/kg (&gt;320) dengan glukosa &gt;600, pH &gt;7,30, HCO3 &gt;15 dan stupor → HHS. Mortalitas HHS 10–50%, terutama akibat penyakit pencetus; target cairan: defisit sekitar 9 L (100–200 mL/kg)."),
Q("C4","Pasien KAD dengan pH arteri 6,8, HCO3 5. Terapi bikarbonat yang sesuai algoritma adalah…",["Tidak perlu bikarbonat","NaHCO3 100 mmol dalam 400 mL air, infus 200 mL/jam; ulangi tiap 2 jam hingga pH &gt;7,0, monitor K+","NaHCO3 50 mmol dalam 200 mL air bolus cepat","NaHCO3 oral 500 mg","NaHCO3 hanya bila pH &gt;7,0"],1,"pH &lt;6,9: NaHCO3 100 mmol dalam 400 mL air steril, 200 mL/jam; pH 6,9–7,0: 50 mmol dalam 200 mL air; pH &gt;7,0: tidak perlu. Ulangi tiap 2 jam sampai pH &gt;7,0 dan monitor kalium karena bikarbonat menggeser K+ ke intrasel."),
Q("C3","Seorang laki-laki 50 tahun GDP 110 mg/dL dan glukosa plasma 2 jam TTGO 130 mg/dL, HbA1c 5,9%. Interpretasi dan tindak lanjut yang tepat adalah…",["DM; mulai metformin","Normal; ulang 3 tahun","Glukosa darah puasa terganggu (prediabetes); intervensi gaya hidup dan pemeriksaan ulang tiap 1 tahun","TGT; mulai insulin","Diabetes gestasional"],2,"GDPT: GDP 100–125 dengan GD 2 jam TTGO &lt;140. HbA1c 5,7–6,4% juga prediabetes. Penatalaksanaan: perubahan gaya hidup (turun BB 5–7%, aktivitas aerobik sedang ≥150 menit/minggu, diet sehat, berhenti merokok). Skrining ulang tiap 1 tahun (normal pada kelompok risiko tinggi tiap 3 tahun). Studi DPP: lifestyle intensif menurunkan insiden DM 58% dalam 3 tahun."),
